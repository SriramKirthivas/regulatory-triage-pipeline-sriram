# Render blueprint — Postgres instance + the FastAPI service.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Render wires DATABASE_URL from the database into the service automatically.
#
# REGIONS MUST MATCH between the database and the service. Render injects the
# database's *internal* hostname (dpg-xxxxx-a, no domain suffix) and internal DNS
# is per-region, so a service in one region cannot resolve a database in another.
# It fails with "Name or service not known" on the first connection, during
# startup. Omitting `region` does not inherit anything — it defaults to Oregon —
# so both are pinned explicitly below.
#
# The database block matches the already-provisioned artixio-db (databaseName
# `rtp`, user `rtp`, Frankfurt). Those are fixed at creation time and cannot be
# changed by editing this file; they are reproduced here so the blueprint binds
# to the existing instance instead of trying to create a mismatched one. The app
# never reads them directly — it only sees the injected DATABASE_URL.

databases:
  - name: artixio-db
    databaseName: rtp
    user: rtp
    plan: free
    region: frankfurt

services:
  - type: web
    name: artixio-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Render supplies postgresql://…; config.py rewrites the scheme to
      # postgresql+psycopg:// because only psycopg 3 is in requirements.txt.
      - key: DATABASE_URL
        fromDatabase:
          name: artixio-db
          property: connectionString
      # The Vercel frontend proxies /api through its own origin, so CORS is not
      # exercised in normal use. This only covers hitting the API directly.
      - key: CORS_ORIGINS
        value: "https://regulatory-triage-pipeline-sriram.vercel.app"
      - key: PYTHONUNBUFFERED
        value: "1"
