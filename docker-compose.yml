services:
  db:
    image: postgres:16-alpine
    container_name: artixio_db
    environment:
      POSTGRES_USER: artixio
      POSTGRES_PASSWORD: artixio
      POSTGRES_DB: regintel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artixio -d regintel"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - artixio_pgdata:/var/lib/postgresql/data

volumes:
  artixio_pgdata:
